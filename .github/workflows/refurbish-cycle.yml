# Always-on cloud worker for the Refurbish resale project (approved by Dylan 2026-10-12).
# Code and data live on the `refurbish` branch; GitHub only runs scheduled workflows from the default branch,
# so this file lives on main and checks out `refurbish`. Docs: refurbish branch -> docs/START-HERE.md
# Free: GitHub Actions is free for standard runners on public repos. Turn off any time: repo -> Actions -> refurbish-cycle -> Disable.
name: refurbish-cycle
on:
  schedule:
    - cron: '17 */4 * * *'      # every 4 hours (harvests the last 6 h, so windows overlap)
  workflow_dispatch:
    inputs:
      hours: {description: 'hours of listings to harvest', default: '6'}
      no_harvest: {description: 'skip the harvest (just ingest + rebuild queue/status)', default: 'false'}
  push:
    branches: [refurbish]
    paths: ['db/inbox/**']       # Lens results uploaded by the Chrome worker -> ingest right away
# Separate groups: a pending scheduled harvest must never be replaced by the frequent push (ingest) runs — GitHub keeps
# only ONE pending run per concurrency group, which is why the 4-hourly schedule never ran on Oct 12–13.
concurrency: {group: "refurbish-cycle-${{ github.event_name == 'push' && 'ingest' || 'harvest' }}", cancel-in-progress: false}
permissions: {contents: write}
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {ref: refurbish, fetch-depth: 50}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Decide whether to harvest
        id: mode
        # Fallback for GitHub's unreliable cron: a push (ingest) run also harvests when the last harvest is > 4.5 h old.
        run: |
          H=no
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event.inputs.no_harvest }}" != "true" ]; then H=yes; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            AGE=$(python3 -c "import json,datetime as d;h=[json.loads(l) for l in open('db/harvests.jsonl') if l.strip()];t=d.datetime.fromisoformat(h[-1]['ts'].replace('Z','+00:00'));print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()/60))" 2>/dev/null || echo 9999)
            if [ "$AGE" -gt 270 ]; then H=yes; fi
          fi
          echo "harvest=$H" >> "$GITHUB_OUTPUT"; echo "harvest=$H"
      - uses: actions/cache@v4
        if: steps.mode.outputs.harvest == 'yes'
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: refurbish-clip-v1
      - name: Install image model (CPU)
        if: steps.mode.outputs.harvest == 'yes'
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q open_clip_torch pillow
      - name: Run one cycle
        run: |
          ARGS="--hours ${{ github.event.inputs.hours || '6' }}"
          if [ "${{ steps.mode.outputs.harvest }}" != "yes" ]; then ARGS="$ARGS --no-harvest"; fi
          python3 scripts/cloud_cycle.py $ARGS
      - name: Commit results
        run: |
          git config user.name "refurbish-bot"; git config user.email "refurbish-bot@users.noreply.github.com"
          git add -A db q STATUS.md status.json
          git diff --cached --quiet && exit 0
          git commit -qm "cycle $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.event_name }})"
          # db/*.jsonl merge with the union driver (.gitattributes); generated files (STATUS, status.json, q/) keep the bot's version.
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs origin refurbish && git push -q origin HEAD:refurbish; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*10))
          done; exit 1
